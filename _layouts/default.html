---
---

<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    <a class="screen-reader-shortcut" href="#main">Skip to main content</a>
    {% include masthead.html %}
    <div class="site-header-image">
      <img src="{{ '/images/header.jpg' | relative_url }}" alt="" width="1920" height="324" fetchpriority="high" decoding="async">
    </div>

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    <div class="site-footer-image">
      <img src="{{ '/images/foot.jpg' | relative_url }}" alt="" width="2268" height="303" loading="lazy" decoding="async">
    </div>

    {% include scripts.html %}

  </body>
</html>
